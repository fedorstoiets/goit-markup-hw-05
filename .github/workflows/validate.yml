name: Format and validate HW5
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prettier formatting
        run: npx --yes prettier@3.6.2 --write index.html css/*.css js/*.js README.md
      - name: Verify Prettier output
        run: npx --yes prettier@3.6.2 --check index.html css/*.css js/*.js README.md
      - name: HTML markup checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          html=Path("index.html").read_text()
          css=Path("css/modal.css").read_text()
          assert html.index('class="backdrop"') > html.index("</footer>")
          assert 'class="backdrop is-open"' not in html
          assert 'class="backdrop"' in html
          assert 'name="subscriber-email"' in html
          assert 'type="submit"' in html
          assert 'name="privacy-accepted"' in html
          assert 'class="modal-checkbox-icon"' in html
          assert 'opacity: 0' in css and 'opacity: 1' in css
          assert 'resize: none' in css
          assert re.search(r'\.modal-input-icon\s*\{[^}]*top:\s*50%',css)
          assert Path("images/icons.svg").exists()
          assert "modal.css" in Path("css/main.css").read_text()
          print("HW5 source structural checks passed")
          PY
      - name: Commit formatted sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css js README.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format HW5 with Prettier"
            git pull --rebase origin main
            git push
          fi
