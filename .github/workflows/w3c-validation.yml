name: W3C Nu HTML Validation
on:
  push:
    paths:
      - '.github/workflows/w3c-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate index.html with W3C Nu Validator
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 3 --silent --show-error \
            -H "Content-Type: text/html; charset=utf-8" \
            --data-binary @index.html \
            "https://validator.w3.org/nu/?out=json" > validation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("validation.json").read_text())
          msgs=[m for m in data.get("messages",[]) if m.get("type")=="error"]
          for m in data.get("messages",[]): print(m.get("type"),m.get("lastLine"),m.get("message"))
          print(f"W3C Nu error count: {len(msgs)}")
          assert not msgs, "W3C Nu validator reported errors"
          PY
